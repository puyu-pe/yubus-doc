name: Publish manual

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish or roll back to
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: yubus-manual-production
  cancel-in-progress: false

jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate inventory and references
        run: python scripts/check_inventory.py
      - name: Build production site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_production.py --site-url https://yubus.puyu.pe/manual/ --site-dir site
      - name: Validate deployment target
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_PRIVATE_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid DEPLOY_PORT"; exit 1; }
          printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT" >> "$GITHUB_ENV"
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Check manual publication target
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -- "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            if [ ! -d /var/www/yubus.puyu.pe/shared/manual ] || [ -L /var/www/yubus.puyu.pe/shared/manual ]; then
              echo "Expected real directory: /var/www/yubus.puyu.pe/shared/manual" >&2
              exit 1
            fi
            if [ ! -L /var/www/yubus.puyu.pe/links/current/public/manual ] || [ "$(readlink -f -- /var/www/yubus.puyu.pe/links/current/public/manual)" != /var/www/yubus.puyu.pe/shared/manual ]; then
              echo "Expected current public/manual symlink to resolve to shared/manual" >&2
              exit 1
            fi
          '
      - name: Synchronize manual only
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" site/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/yubus.puyu.pe/shared/manual/"
      - name: Verify public manual and image
        shell: bash
        run: |
          set -euo pipefail
          docs_url=https://yubus.puyu.pe/manual/
          manual_url=https://yubus.puyu.pe/manual
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$docs_url"
          curl --fail --silent --show-error --retry 3 --retry-all-errors "${docs_url}img/sell_ticket_form.png"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$manual_url")
          case "$status" in 301|302|307|308) ;; *) echo "Expected $manual_url to redirect to $docs_url; received HTTP $status"; exit 1;; esac
          resolved=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --location --output /dev/null --write-out '%{url_effective}' "$manual_url")
          test "$resolved" = "$docs_url"
